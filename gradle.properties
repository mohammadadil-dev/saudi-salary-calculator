org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# R8 "full mode" (the AGP default) has a known bug where its aggressive class/method merging
# corrupts Compose's internal CompositionLocal lookup for LocalLifecycleOwner, causing a
# release-only crash at app launch: "IllegalStateException: CompositionLocal LocalLifecycleOwner
# not present" — happens purely inside Compose runtime internals, no app code involved, and never
# reproduces in debug (unminified) builds. Disabling full mode keeps minification/shrinking/
# obfuscation on, just less aggressive, and avoids this specific R8/Compose interaction.
android.enableR8.fullMode=false
